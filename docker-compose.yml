# One command:  docker compose up --build      then open http://localhost:8000
services:
  db:
    build:
      context: .
      dockerfile: docker/db.Dockerfile
    environment:
      POSTGRES_PASSWORD: mada
      POSTGRES_HOST_AUTH_METHOD: trust      # local demo only
      PGTZ: UTC
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=200
      -c shared_buffers=256MB
    shm_size: 512mb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 40

  mada:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      MADA_PG_HOST: db
      MADA_PG_PORT: "5432"
      MADA_PG_USER: postgres
      MADA_PG_PASSWORD: mada
    ports:
      - "8000:8000"

volumes:
  pgdata:
